name: alhazen-web-v2

# ---------------------------------------------------------------------------
# Usage:
#   docker compose up -d --build
#   docker compose run --rm app php artisan key:generate   # persist APP_KEY
#
# Every variable below can be overridden from the host shell or from a
# `.env` file next to this compose file (docker compose reads it automatically).
# ---------------------------------------------------------------------------

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-Alhazen Web}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:-}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost}
  APP_LOCALE: ${APP_LOCALE:-en}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
  APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER:-file}

  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_LEVEL: ${LOG_LEVEL:-error}

  # Database - default is SQLite (file is mounted to the host).
  # To use MySQL/PostgreSQL, set DB_CONNECTION/DB_HOST/... accordingly.
  DB_CONNECTION: ${DB_CONNECTION:-sqlite}
  DB_HOST: ${DB_HOST:-127.0.0.1}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-database/database.sqlite}
  DB_USERNAME: ${DB_USERNAME:-root}
  DB_PASSWORD: ${DB_PASSWORD:-}

  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_DOMAIN: ${SESSION_DOMAIN:-null}

  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  CACHE_STORE: ${CACHE_STORE:-database}

  REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
  REDIS_HOST: ${REDIS_HOST:-127.0.0.1}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  REDIS_PORT: ${REDIS_PORT:-6379}

  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
  MAIL_PORT: ${MAIL_PORT:-2525}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-${APP_NAME:-Alhazen Web}}

  # App specific
  QUIZ_PIN: ${QUIZ_PIN:-}

  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  AWS_BUCKET: ${AWS_BUCKET:-}
  AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}

  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}

# ---------------------------------------------------------------------------
# Persistent data on the host. Override the root with APP_DATA_DIR, e.g.
#   APP_DATA_DIR=/mnt/storage docker compose up -d
# Layout:  ${APP_DATA_DIR}/storage/          -> uploads, logs, cache, sessions
#          ${APP_DATA_DIR}/database.sqlite   -> SQLite database
# NOTE: database.sqlite must be a FILE - if it is missing Docker creates a
# directory with that name and SQLite will fail to start.
# ---------------------------------------------------------------------------
x-app-volumes: &app-volumes
  - ${APP_DATA_DIR:-./data}/storage:/var/www/html/storage
  - ${APP_DATA_DIR:-./data}/database.sqlite:/var/www/html/database/database.sqlite

services:
  # PHP-FPM - runs migrations / caches config via docker/entrypoint.sh
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${APP_NAME:-Alhazen Web}
    image: alhazen-web-v2:latest
    restart: unless-stopped
    environment: *app-env
    # storage/ + SQLite database live on the host (see x-app-volumes above)
    volumes: *app-volumes
    expose:
      - "9000"
    networks:
      - default
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # nginx - public entrypoint, serves public/ and proxies PHP to app:9000
  web:
    image: alhazen-web-v2:latest
    command: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${APP_DATA_DIR:-./data}/storage:/var/www/html/storage
    networks:
      - default
      - dokploy-network

  # Queue worker (QUEUE_CONNECTION=database)
  worker:
    image: alhazen-web-v2:latest
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=120", "--sleep=3"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment: *app-env
    volumes: *app-volumes
    networks:
      - default
      - dokploy-network

